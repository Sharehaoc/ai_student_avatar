services:
  - type: web
    name: ai-avatar-core
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @flying-eagle/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: flying-eagle-voice-agent
      - key: VOICE_GLOBAL_CONCURRENCY_LIMIT
        value: "5"
      - key: VOICE_SETUP_RATE_LIMIT
        value: "5"
      - key: VOICE_INTERNAL_TOKEN
        sync: false
      - key: VOICE_PREVIEW_RATE_LIMIT
        value: "5"
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_GROUP_ID
        sync: false
      - key: MINIMAX_API_HOST
        value: https://api.minimax.io
      - key: VOICE_POWER_ON
        value: "false"

  - type: web
    name: ai-avatar-web
    runtime: static
    branch: main
    rootDir: .
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @flying-eagle/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_PERSONA_ID
        sync: false
      - key: VITE_PERSONA_AVATAR_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

name: 驗證學員 AI 分身

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript、測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  voice-agent:
    name: Python 語音 Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/voice-agent/requirements.lock
      - run: python -m pip install --requirement apps/voice-agent/requirements.lock
      - run: python -m pip install --no-deps --editable apps/voice-agent
      - run: python -m pip check
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s apps/voice-agent/tests -p 'test_*.py'
      - run: python -m compileall -q apps/voice-agent/src
